# Scaffolded local stack. Run from the repo root:
#   docker compose -f docker/compose.yml up --build
# Reads secrets from the repo-root .env (DATABASE_URL points at Neon).

name: recogno

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file: ../.env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file: ../.env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The database lives on Neon, so no local Postgres by default.
  # Uncomment to run fully offline, and point DATABASE_URL at it:
  #   DATABASE_URL=postgres://recogno:recogno@postgres:5432/recogno
  #
  # postgres:
  #   image: postgres:18-alpine
  #   environment:
  #     POSTGRES_USER: recogno
  #     POSTGRES_PASSWORD: recogno
  #     POSTGRES_DB: recogno
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U recogno"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10

volumes:
  redis-data:
  # postgres-data:
