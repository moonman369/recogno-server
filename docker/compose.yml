# Scaffolded local stack. Run from the repo root:
#   docker compose -f docker/compose.yml up --build
# Reads secrets from the repo-root .env.
#
# Postgres is not part of this stack. It runs as `recogno-postgres` in its own
# compose project on the external `recogno-net` network, so api and worker join
# that network and reach it at `postgres:5432` — the same shape as the VM. Bring
# it up first, or `docker network create recogno-net` if you only want the
# network. To run without it, see the commented-out service at the bottom.

name: recogno

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file: ../.env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    # Listing networks opts out of the implicit default, so `default` has to be
    # named too or redis becomes unreachable.
    networks:
      - default
      - recogno-net
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file: ../.env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    networks:
      - default
      - recogno-net
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Fully-offline alternative: uncomment this, drop `recogno-net` from the api
  # and worker `networks:` lists and from the `networks:` block below, and point
  # DATABASE_URL at it:
  #   DATABASE_URL=postgresql://recogno:recogno@postgres:5432/recogno
  #
  # postgres:
  #   image: postgres:18-alpine
  #   environment:
  #     POSTGRES_USER: recogno
  #     POSTGRES_PASSWORD: recogno
  #     POSTGRES_DB: recogno
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U recogno"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10

networks:
  # Owned by the Postgres compose project, not this one — hence `external`.
  recogno-net:
    external: true

volumes:
  redis-data:
  # postgres-data:
