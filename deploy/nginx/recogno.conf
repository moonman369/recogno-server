# Host Nginx vhost for the API. Nginx runs on the VM itself (apt), not in a
# container - see docs/DEPLOYMENT_SOP.md step 4.
#
# Copy to /etc/nginx/sites-available/recogno, symlink into sites-enabled, then
# run `sudo certbot --nginx -d <domain>`. Certbot rewrites this file in place:
# it adds the :443 server block with the certificate paths and turns the :80
# block into an HTTP -> HTTPS redirect. Do not hand-write those parts.

server {
    listen 80;
    listen [::]:80;
    server_name api.recogno.moonman.in;

    # The API is published on 127.0.0.1:3000 by compose.yaml, so this proxy is
    # the only route in from the internet.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
